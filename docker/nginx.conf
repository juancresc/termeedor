# The whole project is mounted so edits to index.html always show up (a single-file
# mount keeps serving the old copy once the file is replaced). Only the app is served.
server {
  listen 80;
  root /app;
  index index.html;

  # always check for a newer file, since this serves a working copy
  add_header Cache-Control "no-cache" always;

  location = / {}
  location = /index.html {}
  location /src/ {}
  location /styles/ {}
  location /themes/ {}
  # nginx doesn't know .mjs, and browsers only run modules served as JavaScript
  location = /node_modules/@xterm/headless/lib-headless/xterm-headless.mjs {
    types {}
    default_type text/javascript;
  }

  location ~ /\. { return 404; }
  location / { return 404; }
}
