# Builds the desktop app and publishes a GitHub Release when a version tag is pushed.
#   npm version patch && git push --follow-tags
#
# File names carry no version, so releases/latest/download/<file> always works.
# Casks/termeedor.rb and scripts/install.sh both rely on that.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        # One native runner per CPU: node-pty is compiled, so cross-building isn't reliable.
        include:
          - { runner: macos-latest, args: --mac --arm64 }
          - { runner: macos-15-intel, args: --mac --x64 }
          - { runner: ubuntu-latest, args: --linux --x64 }
          - { runner: ubuntu-24.04-arm, args: --linux --arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no Apple certificate yet
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
