<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'self';">
  <title>Termeedor</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/themes.css">
  <!-- Imported theme files are injected here (see src/settings.js) -->
  <style id="customThemes"></style>
  <script type="module" src="src/main.js"></script>
</head>
<body>
<div class="app" id="app">

  <!-- Title bar: sidebar toggle, current group, tabs -->
  <header class="titlebar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="tabs groupTabs" id="groupTabs"></div>
    <button class="tb-btn" id="newGroupTabBtn" title="New group" data-shortcut="newGroup">＋</button>
    <button class="tb-btn" id="allGroupsBtn" aria-pressed="false">⊞</button>
    <button class="tb-btn" id="settingsBtn" title="Settings" data-shortcut="openSettings">⚙</button>
  </header>

  <!-- The selected group's tabs -->
  <nav class="tabStrip">
    <div class="tabs" id="tabs"></div>
    <button class="tb-btn" id="newTabBtn" title="New tab" data-shortcut="newTab">＋</button>
  </nav>

  <!-- Sidebar (resizable) and the strip shown when it is hidden -->
  <div class="resizer" id="resizer" title="Drag to resize · double-click to reset"></div>
  <div class="rail" id="rail" title="Show sidebar" data-shortcut="toggleSidebar">
    <span class="arrow">»</span><span class="vlabel">Groups &amp; sessions</span>
  </div>
  <aside class="sidebar">
    <div class="sec">Groups <span class="secBtns"><button id="hideSidebar" title="Hide sidebar" data-shortcut="toggleSidebar">«</button><button id="newGroupBtn" title="New group" data-shortcut="newGroup">＋</button></span></div>
    <div id="groups"></div>
    <div class="sec">Sessions <button class="secClear" id="clearPast" title="Clear all sessions" aria-label="Clear all sessions"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 7v4M9.2 7v4"/></svg></button></div>
    <input class="pastSearch" id="pastSearch" placeholder="Search closed tabs…" maxlength="60">
    <div id="pastSessions"></div>
  </aside>

  <!-- Terminal: read-only command blocks over an input editor -->
  <main class="main">
    <div class="termScroll" id="termScroll">
      <div class="output" id="output" role="log"></div>
      <div class="inputRow" id="inputRow">
        <div class="inputLines" id="inputLines" aria-hidden="true"></div>
        <span class="promptMark" id="promptMark" aria-hidden="true"></span>
        <textarea class="editor" id="editor" rows="1" aria-label="Command" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </div>
    </div>
    <div id="fullTerms"></div>
  </main>

  <footer class="status">
    <span id="stTab"></span><span id="stCwd"></span><span id="stRunning"></span><span class="sp"></span>
    <span id="stPlugins"></span>
    <span id="stPos"></span>
    <span class="zoomBtns"><button id="zoomOut" title="Smaller text" data-shortcut="textSmaller">−</button><button id="zoomIn" title="Larger text" data-shortcut="textLarger">+</button></span>
  </footer>
</div>

<dialog id="settings">
  <div class="setHead"><b>Settings</b><button class="icon-btn shown" id="closeSettings" title="Close (Esc)">✕</button></div>
  <div class="setMain">
  <div class="setBody" id="settingsBody">
    <div class="hint" id="settingsNoMatch" hidden>No settings match your search.</div>

    <section class="setGroup">
      <h4>Theme</h4>
      <div class="themes" id="themes"></div>
      <div class="themeActions">
        <button class="btn" id="importTheme" title="Choose a .css file to add as a theme">＋ Add theme from .css file</button>
        <input type="file" id="themeFile" accept=".css,text/css" hidden>
        <span class="hint">CSS shows a theme's code, where you can copy it or save it as a new theme.</span>
      </div>
    </section>

    <section class="setGroup">
      <h4>Display</h4>
      <div class="setRow"><label for="fontSize">Font size</label> <span><button type="button" class="btn stepBtn" id="fontSizeDown" title="Reduce font size" aria-label="Reduce font size">−</button> <input type="range" id="fontSize" min="10" max="20" step="1"> <button type="button" class="btn stepBtn" id="fontSizeUp" title="Increase font size" aria-label="Increase font size">+</button> <output id="fontSizeOut"></output></span></div>
      <label class="setRow">Show line numbers on multiline input <input type="checkbox" id="lineNumbers"></label>
      <label class="setRow">Show sidebar <input type="checkbox" id="showSidebar"></label>
    </section>

    <section class="setGroup">
      <h4>Tabs</h4>
      <label class="setRow" data-keywords="directory folder cwd working">Open new tabs in the current path <input type="checkbox" id="newTabInCurrentPath"></label>
      <div class="setRow">Default color for new tabs <span class="colorPick" id="defaultTabColor"></span></div>
      <label class="setRow" data-keywords="history up arrow recall commands"><span class="setText">Share history between tabs <span class="hint">Up and Down reach commands from other tabs, open or closed, after this tab's own.</span></span> <input type="checkbox" id="sharedHistory"></label>
      <label class="setRow" data-keywords="groups">Show all tabs <input type="checkbox" id="showAllGroups"></label>
      <label class="setRow" data-keywords="arrows left right reorder buttons order"><span class="setText">Show move arrows on tabs and groups <span class="hint">Off leaves more room for names. Dragging moves them either way.</span></span> <input type="checkbox" id="moveButtons"></label>
      <label class="setRow" data-keywords="confirm close"><span class="setText">Ask before closing groups <span class="hint">Only when the group has tabs.</span></span> <input type="checkbox" id="confirmCloseGroup"></label>
    </section>

    <section class="setGroup">
      <h4>Plugins</h4>
      <div id="pluginList"></div>
      <div class="themeActions">
        <button class="btn" id="openPluginsDir" title="Open the folder your plugins go in">Open plugins folder</button>
        <button class="btn" id="reloadPlugins" title="Reload the app to pick up new or edited plugins">Reload plugins</button>
      </div>
      <div class="hint pluginsHint" id="pluginsHint"></div>
    </section>

    <section class="setGroup">
      <h4>Shortcuts</h4>
      <div id="shortcutList"></div>
    </section>
  </div>
  <nav class="setNav" aria-label="Settings topics">
    <input type="text" class="setSearch" id="settingsSearch" placeholder="Search settings" aria-label="Search settings" spellcheck="false" autocomplete="off" autofocus>
    <div class="setTopics" id="settingsTopics"></div>
  </nav>
  </div>
</dialog>

<dialog id="themeEditor" aria-labelledby="themeName">
  <header class="themeBar">
    <b id="themeName"></b>
    <span class="themeKind" id="themeKind"></span>
    <span class="themeMsg" id="themeMsg" role="status"></span>
    <button class="btn" id="copyTheme" title="Copy this CSS to the clipboard">Copy</button>
    <button class="btn" id="saveAsNew" title="Create a new theme from this text and select it">Save as new theme</button>
    <button class="btn" id="saveTheme" title="Save (Ctrl+S)">Save</button>
    <button class="icon-btn shown" id="closeThemeEditor" title="Close (Esc)">✕</button>
  </header>
  <textarea class="themeCss" id="themeCss" aria-label="Theme CSS" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
</dialog>
</body>
</html>
